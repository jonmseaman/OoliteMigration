# Meson cross file: clang from the MSYS2 UCRT64 toolchain targeting arm64 macOS. There is no macOS
# SDK on the Windows machine, so configuring stops at meson's sanity check ('library not found for
# -lSystem'); pass --sysroot=<MacOSX.sdk> to go further. The macOS build itself is native, on a Mac
# (see README.md in oolite-dev). Run from oolite-dev:
#   meson setup build-aarch64-darwin --cross-file ../tools/cross/aarch64-apple-darwin.ini
[binaries]
c = ['clang', '--target=arm64-apple-darwin21', '-fuse-ld=lld']
cpp = ['clang++', '--target=arm64-apple-darwin21', '-fuse-ld=lld']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'false'

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'
