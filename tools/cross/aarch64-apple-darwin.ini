# Meson cross file for the Phase 1 exit-gate line "the tree builds for aarch64-apple-darwin as far
# as the GNUstep dependency permits" (bead oo-5pr). Host-independent: clang targets arm64 macOS from
# the MSYS2 UCRT64 toolchain; there is no macOS SDK on this machine, so the attempt records where the
# configure/compile stops rather than claiming a build. Run from upstream/oolite:
#   meson setup build-aarch64-darwin --cross-file ../../tools/cross/aarch64-apple-darwin.ini
# Result on the fleet machine (2026-09-23): compiler and ld64.lld detected; stops at meson's
# sanity check, 'library not found for -lSystem' -- no macOS SDK (libSystem, libc++ headers), so
# the GNUstep dependency is never reached. Pass --sysroot=<MacOSX.sdk> on a Mac to go further.
[binaries]
c = ['clang', '--target=arm64-apple-darwin21', '-fuse-ld=lld']
cpp = ['clang++', '--target=arm64-apple-darwin21', '-fuse-ld=lld']
objc = ['clang', '--target=arm64-apple-darwin21', '-fuse-ld=lld']
objcpp = ['clang++', '--target=arm64-apple-darwin21', '-fuse-ld=lld']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'false'

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'aarch64'
cpu = 'arm64'
endian = 'little'
