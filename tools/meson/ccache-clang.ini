# Native file for tools/build-windows.sh: upstream's clang.ini plus a ccache wrapper.
#
# It has to restate clang.ini rather than layer on top of it: mk.sh splices --setup-flags in
# BEFORE its own --native-file, and meson lets the LAST native file win, so a ccache file passed
# through --setup-flags would be overridden by clang.ini's bare 'clang'.
#
# Wrapping the compiler here is what actually turns ccache on. Meson only inserts ccache by
# itself when it discovers the compiler; naming the compiler in a native file suppresses that,
# which is why the stock build compiles with bare 'clang' and leaves the cache empty.

[binaries]
c = ['ccache', 'clang']
cpp = ['ccache', 'clang++']
objc = ['ccache', 'clang']
objcpp = ['ccache', 'clang++']
c_ld = 'lld'
cpp_ld = 'lld'
objc_ld = 'lld'
objcpp_ld = 'lld'
