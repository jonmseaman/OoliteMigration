# Native file for tools/build-windows.sh --gcc: upstream's gcc.ini plus a ccache wrapper (bead oo-1q4).
#
# The GCC twin of ccache-clang.ini, restated for the same reason (meson lets the last native file
# win, and naming the compiler suppresses meson's own ccache detection). ld.bfd, as gcc.ini says:
# GCC's LTO plugin is bfd's.

[binaries]
c = ['ccache', 'gcc']
cpp = ['ccache', 'g++']
c_ld = 'bfd'
cpp_ld = 'bfd'

# Its code-generation flags (-ffunction-sections, -fdata-sections, -fno-devirtualize-speculatively,
# -Wl,--gc-sections) are passed by tools/build-windows.sh --gcc, which says why: a native file's
# [built-in options] are read only when the build directory is first configured.
