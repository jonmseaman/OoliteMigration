[pytest]
# frame_hash.py, frame_capture.py and golden_run.py are imported as top-level modules by the tests
# in this directory, so the directory must be on sys.path wherever pytest is invoked from.
pythonpath = .

markers =
    online: launches a real Oolite process and renders frames (~22-31 s per launch on this host).
        Deselected by default with -m "not online" so the offline tier stays a one-second check
        that runs anywhere; the online tier is the end-to-end claim and needs the shared build.
